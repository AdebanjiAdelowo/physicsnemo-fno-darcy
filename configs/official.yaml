# Adapted from examples/cfd/darcy_fno/config.yaml of NVIDIA PhysicsNeMo, commit
# b45a5c810c741e6b41f8515be24c51121f8fc21f. Modified by Adebanji Adelowo (2026):
# the keys above the marker are the upstream keys with the upstream values; the
# keys below the marker were added for this repository.

arch:
  decoder:
    out_features: 1
    layers: 1
    layer_size: 32

  fno:
    in_channels: 1
    dimension: 2
    latent_channels: 32
    fno_layers: 4
    fno_modes: 12
    padding: 9

normaliser:
  permeability:
    mean: 1.25
    std_dev: .75
  darcy:
    mean: 4.52E-2
    std_dev: 2.79E-2

scheduler:
  initial_lr: 1.E-3
  decay_rate: .85
  decay_pseudo_epochs: 8

training:
  resolution: 256
  batch_size: 64
  rec_results_freq : 8
  max_pseudo_epochs: 256
  pseudo_epoch_sample_size: 2048

validation:
  sample_size: 256
  validation_pseudo_epochs: 4

# ---------------------------------------------------------------------------
# Added in this repository
# ---------------------------------------------------------------------------

name: official
output_dir: runs/${name}
device: auto            # auto: cuda if available, else mps, else cpu

data:
  # stream: every training batch is a new Darcy2D sample (upstream protocol).
  # fixed:  a finite training set of training.pseudo_epoch_sample_size samples,
  #         generated once and cached; one pseudo-epoch is one shuffled pass.
  source: stream
  # false: Darcy2D as shipped (all samples of a batch are identical, see README).
  # true:  IndependentDarcy2D, which draws every Fourier coefficient independently.
  independent_samples: false
  dir: data
  convergence_threshold: 1.0e-6   # Darcy2D default
  max_iterations: 30000           # Darcy2D default
  generation_batch_size: 64
  generation_device: auto         # auto: the training device (CPU for MPS); cuda or cpu selects that cache
  test_samples: 256
  seeds:
    train: 1000
    validation: 2000
    test: 3000

study:
  fno_modes: [12]       # upstream value only
  seeds: [0]

evaluation:
  plot_samples: 2
  timing_warmup: 5
  timing_repeats: 30
